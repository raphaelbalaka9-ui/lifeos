<title>LifeOS</title>
<link rel="stylesheet" href="fonts.css">
<style>
html,body,#root{height:100%;margin:0}
body{background:#e6e7e9;transition:background-color 2s ease-in-out}
body[data-theme="sombre"]{background:#0b0b0c;color-scheme:dark}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
#lifeos-splash{display:none;position:fixed;inset:0;z-index:9999;place-items:center;background:#0b0b0c;transition:opacity .45s ease,transform .45s ease}
#lifeos-splash .mk{width:84px;height:84px;border-radius:24px;background:#f2f2f3;color:#0b0b0c;display:grid;place-items:center;font:700 44px 'Urbanist','Manrope',system-ui,sans-serif;animation:lifeos-pop .7s cubic-bezier(.2,.9,.25,1.2) both}
#lifeos-splash .nm{margin-top:16px;color:#f2f2f3;font:700 20px 'Urbanist','Manrope',system-ui,sans-serif;letter-spacing:-.01em;text-align:center;animation:lifeos-up .6s .2s ease both}
@keyframes lifeos-pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes lifeos-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:760px){#lifeos-splash{display:grid}}
</style>
</head>
<body>
<div id="lifeos-splash" aria-hidden="true"><div><div class="mk">L</div><div class="nm">LifeOS</div></div></div>
